# DBK Wi-Fi firmware at 11 dBm transmit power, for range tests next to the
# 8.5 dBm default in dbk.yaml. Everything else is identical.
substitutions:
  name: dbk-tx11
  friendly_name: DBK
  device_id: DBK
  name_add_mac_suffix: "true"
  project_version: "0.1.0-tx11"
  wifi_output_power: "11dBm"

packages:
  device: !include dbk.yaml
