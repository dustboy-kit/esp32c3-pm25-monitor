substitutions:
  name: dbk
  friendly_name: DBK
  device_id: DBK
  name_add_mac_suffix: "true"
  project_version: "0.1.0"
  good_limit: "25"
  fair_limit: "50"
  splash_seconds: "3"
  wifi_ap_timeout_seconds: "90"
  wifi_ap_active_timeout_minutes: "15"
  wifi_reboot_timeout: "990s"
  wifi_output_power: "8.5dBm"
  # Fleet MQTT (packages/mqtt.yaml). Host and user are public; the password and
  # the kit id are stored on the board from the web page. A workshop.yaml may
  # pre-seed both at compile time (kit_id: DBK-001, mqtt_password: !secret ...).
  mqtt_broker: mqtt.laris.co
  mqtt_port: "1883"
  mqtt_username: dbk
  mqtt_password: ""
  kit_id: ""
  timezone: "Asia/Bangkok"
  warmup_seconds: "30"
  stale_seconds: "10"

# DustBoy fork of improv_serial: Kit ID + MQTT password over USB (components/).
external_components:
  - source:
      type: local
      path: components

packages:
  board: !include packages/board.yaml
  connectivity: !include packages/connectivity.yaml
  pms7003: !include packages/pms7003.yaml
  status_led: !include packages/status-led.yaml
  oled: !include packages/oled.yaml
  diagnostics: !include packages/diagnostics.yaml
  mqtt: !include packages/mqtt.yaml
