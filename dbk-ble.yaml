# DBK over Bluetooth Low Energy. Same board, sensor, OLED and LED as dbk.yaml,
# but no Wi-Fi at all: readings are served over a BLE GATT service and read
# from site/ble/ with Web Bluetooth (Chrome on Android, macOS, Windows, Linux).
#
#   esphome run dbk-ble.yaml
#
# Why a separate variant: the ESP32-C3 SuperMini clones used for DBK fail WPA
# authentication at the default Wi-Fi TX power (see packages/connectivity.yaml),
# and running BLE and Wi-Fi together on the single-core C3 costs RAM and
# stability. BLE alone sidesteps both.

substitutions:
  name: dbk-ble
  friendly_name: DBK BLE
  device_id: DBK
  name_add_mac_suffix: "true"
  project_version: "0.2.0-ble"
  good_limit: "25"
  fair_limit: "50"
  splash_seconds: "3"
  warmup_seconds: "30"
  stale_seconds: "10"
  # BLE advertised name, 13 characters max (a "-XXXXXX" MAC suffix is appended).
  ble_name: "DBK"
  # One custom 128-bit service; keep these in sync with site/ble/index.html.
  ble_service_uuid: "d8b70001-5b1e-4c3a-9f2e-00d0b0000001"
  ble_pm1_uuid: "d8b70002-5b1e-4c3a-9f2e-00d0b0000001"
  ble_pm25_uuid: "d8b70003-5b1e-4c3a-9f2e-00d0b0000001"
  ble_pm10_uuid: "d8b70004-5b1e-4c3a-9f2e-00d0b0000001"
  ble_status_uuid: "d8b70005-5b1e-4c3a-9f2e-00d0b0000001"
  ble_alias_uuid: "d8b70006-5b1e-4c3a-9f2e-00d0b0000001"
  ble_ota_ctrl_uuid: "d8b70010-5b1e-4c3a-9f2e-00d0b0000001"
  ble_ota_data_uuid: "d8b70011-5b1e-4c3a-9f2e-00d0b0000001"
  ble_ota_status_uuid: "d8b70012-5b1e-4c3a-9f2e-00d0b0000001"
  # Shared passcode the OTA page sends with BEGIN. Guards against mistakes,
  # not against attackers: anyone in BLE range who knows it can flash.
  ble_ota_passcode: "dbk"

packages:
  board: !include packages/board.yaml
  ble: !include packages/ble.yaml
  pms7003: !include packages/pms7003.yaml
  status_led: !include packages/status-led.yaml
  oled: !include packages/oled-ble.yaml
  diagnostics: !include packages/diagnostics-ble.yaml
