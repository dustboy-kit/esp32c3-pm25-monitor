api:
  # A browser uses the Web API below; Home Assistant and ESPHome tooling use
  # this native protobuf API. Keep the monitor running if neither is present.
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  id: wifi_component
  # The ESP32-C3 SuperMini clones fail WPA authentication at the ESPHome
  # default (20 dBm): antenna matching on some batches reflects the full-power
  # auth frame and the small LDO sags on the TX peak. 8.5 dBm was proven on
  # 2026-08-27; 11 dBm passed the same cold-start test (30/30) elsewhere with
  # more uplink margin and is offered as a test image (dbk-tx11.yaml). Override
  # per device with wifi_output_power in workshop.yaml.
  output_power: ${wifi_output_power}
  power_save_mode: none
  passive_scan: false
  # fast_connect skips the scan, so a kit that already holds credentials answers
  # Improv's network list with nothing (the web page then shows only "Join other").
  # Scan-based connect also picks the strongest BSSID. Verified on 2026-11-06.
  fast_connect: false
  min_auth_mode: WPA
  reboot_timeout: ${wifi_reboot_timeout}
  ap:
    ssid: ${friendly_name}
    password: "12345678"
    ap_timeout: ${wifi_ap_timeout_seconds}s
  on_connect:
    - globals.set:
        id: wifi_disconnected_since_ms
        value: "0"
  on_disconnect:
    - lambda: |-
        if (id(wifi_disconnected_since_ms) == 0) {
          id(wifi_disconnected_since_ms) = millis();
        }

captive_portal:

time:
  - platform: sntp
    id: network_time
    timezone: ${timezone}

improv_serial:
  next_url: "https://dustboy-kit.github.io/esp32c3-pm25-monitor/dashboard/?host={{device_name}}.local"
  # DustBoy fork (components/improv_serial): the setup page sets these over USB.
  kit_id_text: kit_id
  mqtt_password_text: mqtt_password

esp32_improv:
  authorizer: none

web_server:
  version: 3
  include_internal: false
  # The kit serves its own small dashboard (web/kit-dashboard.js, gzipped into
  # flash) instead of the stock ESPHome UI, so http://<kit>/ shows PM values on
  # any browser in the same Wi-Fi. REST JSON and /events stay available.
  local: false
  js_url: ""
  js_include: web/kit-dashboard.js
  enable_private_network_access: true
  ota: false
  log: false

dashboard_import:
  package_import_url: github://dustboy-kit/esp32c3-pm25-monitor/dbk.yaml@main
  import_full_config: false
