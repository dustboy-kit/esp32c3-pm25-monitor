api:
  # A browser uses the Web API below; Home Assistant and ESPHome tooling use
  # this native protobuf API. Keep the monitor running if neither is present.
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  id: wifi_component
  output_power: 8.5dBm
  reboot_timeout: ${wifi_reboot_timeout}
  ap:
    ssid: ${friendly_name}
    password: "12345678"
    ap_timeout: ${wifi_ap_timeout_seconds}s
  on_connect:
    - globals.set:
        id: wifi_disconnected_since_ms
        value: "0"
  on_disconnect:
    - lambda: |-
        if (id(wifi_disconnected_since_ms) == 0) {
          id(wifi_disconnected_since_ms) = millis();
        }

captive_portal:

time:
  - platform: sntp
    id: network_time
    timezone: ${timezone}

improv_serial:

esp32_improv:
  authorizer: none

web_server:
  version: 3
  include_internal: false
  # Keep the complete dashboard on the board so http://<node>.local/ works
  # without an internet connection. REST JSON and /events are served here too.
  local: true
  enable_private_network_access: true
  ota: false
  log: false

dashboard_import:
  package_import_url: github://dustboy-kit/esp32c3-pm25-monitor/dbk.yaml@main
  import_full_config: false
