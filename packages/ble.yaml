# Bluetooth Low Energy profile for the DBK monitor.
#
# This package replaces Wi-Fi entirely. The board advertises as "DBK <mac>"
# and exposes one GATT service with PM1.0 / PM2.5 / PM10 as little-endian
# float32 characteristics (read + notify) plus one UTF-8 status string.
# A phone or laptop reads it from site/ble/ over Web Bluetooth; no network,
# no access point, no WPA authentication, no Wi-Fi TX power problem.

esp32_ble:
  # 13 characters max because name_add_mac_suffix is enabled in board.yaml.
  name: ${ble_name}

esp32_ble_server:
  manufacturer: "DustBoy Kit"
  model: "DBK BLE"
  firmware_version: ${project_version}
  max_clients: 2
  on_connect:
    - globals.set:
        id: ble_client_count
        value: !lambda "return id(ble_client_count) + 1;"
  on_disconnect:
    - globals.set:
        id: ble_client_count
        value: !lambda "return id(ble_client_count) > 0 ? id(ble_client_count) - 1 : 0;"
  services:
    - uuid: ${ble_service_uuid}
      advertise: true
      characteristics:
        - id: ble_pm1
          uuid: ${ble_pm1_uuid}
          description: "PM1.0 ug/m3 float32 LE"
          read: true
          notify: true
          value:
            data: !lambda |-
              float v = id(pms_pm1).has_state() ? id(pms_pm1).state : NAN;
              return bytebuffer::ByteBuffer::wrap(v, bytebuffer::LITTLE).get_data();
        - id: ble_pm25
          uuid: ${ble_pm25_uuid}
          description: "PM2.5 ug/m3 float32 LE"
          read: true
          notify: true
          value:
            data: !lambda |-
              float v = id(pms_pm25).has_state() ? id(pms_pm25).state : NAN;
              return bytebuffer::ByteBuffer::wrap(v, bytebuffer::LITTLE).get_data();
        - id: ble_pm10
          uuid: ${ble_pm10_uuid}
          description: "PM10 ug/m3 float32 LE"
          read: true
          notify: true
          value:
            data: !lambda |-
              float v = id(pms_pm10).has_state() ? id(pms_pm10).state : NAN;
              return bytebuffer::ByteBuffer::wrap(v, bytebuffer::LITTLE).get_data();
        - id: ble_status
          uuid: ${ble_status_uuid}
          description: "Air quality level text"
          read: true
          notify: true
          value:
            data: !lambda |-
              std::string s = id(air_quality_level).has_state() ? id(air_quality_level).state : std::string("WARMUP");
              return std::vector<uint8_t>(s.begin(), s.end());
        - id: ble_alias
          uuid: ${ble_alias_uuid}
          description: "Device alias"
          read: true
          value:
            data: !lambda |-
              std::string s = id(device_alias).state;
              return std::vector<uint8_t>(s.begin(), s.end());

        # ---- firmware update over BLE (see packages/ble_ota.h) ----
        # ota_ctrl: "BEGIN <size> <sha256hex> <passcode>" | "END" | "ABORT"
        - id: ble_ota_ctrl
          uuid: ${ble_ota_ctrl_uuid}
          description: "OTA control"
          write: true
          on_write:
            then:
              - lambda: |-
                  std::string cmd(x.begin(), x.end());
                  if (cmd.rfind("BEGIN ", 0) == 0) {
                    char sha[65] = {0}; char pass[32] = {0}; unsigned long size = 0;
                    if (sscanf(cmd.c_str(), "BEGIN %lu %64s %31s", &size, sha, pass) != 3 ||
                        std::string(pass) != std::string("${ble_ota_passcode}")) {
                      dbk_ble_ota::fail("bad begin");
                    } else {
                      dbk_ble_ota::begin((size_t) size, std::string(sha));
                    }
                  } else if (cmd == "END") {
                    if (dbk_ble_ota::end()) {
                      id(ota_reboot_at_ms) = millis() + 1500;
                    }
                  } else if (cmd == "ABORT") {
                    dbk_ble_ota::abort_session();
                  }
              # progress/result is pushed by the 1 s interval below
        # ota_data: raw image bytes, any chunk size up to the MTU
        - id: ble_ota_data
          uuid: ${ble_ota_data_uuid}
          description: "OTA data"
          write: true
          write_no_response: true
          on_write:
            then:
              - lambda: |-
                  dbk_ble_ota::write(x);
        # ota_status: "IDLE" | "RX n/total" | "VERIFY" | "OK" | "ERR <reason>"
        - id: ble_ota_status
          uuid: ${ble_ota_status_uuid}
          description: "OTA status"
          read: true
          notify: true
          value:
            data: !lambda |-
              std::string s = dbk_ble_ota::status() + " slot=" + dbk_ble_ota::running_slot() + " v=${project_version}";
              return std::vector<uint8_t>(s.begin(), s.end());

esphome:
  includes:
    - packages/ble_ota.h

globals:
  - id: ble_client_count
    type: int
    restore_value: false
    initial_value: "0"
  - id: ota_reboot_at_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

# Push a fresh reading to every subscribed client once per second. The
# characteristic values are templated, so each notify re-reads the sensors.
interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: return id(ble_client_count) > 0;
          then:
            - ble_server.characteristic.notify:
                id: ble_pm1
            - ble_server.characteristic.notify:
                id: ble_pm25
            - ble_server.characteristic.notify:
                id: ble_pm10
            - ble_server.characteristic.notify:
                id: ble_status
            - ble_server.characteristic.notify:
                id: ble_ota_status
      - if:
          condition:
            lambda: return id(ota_reboot_at_ms) != 0 && millis() >= id(ota_reboot_at_ms);
          then:
            - lambda: |-
                ESP_LOGI("ble_ota", "rebooting into the new image");
                App.safe_reboot();
