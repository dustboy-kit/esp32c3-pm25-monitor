sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: Wi-Fi RSSI
    update_interval: 30s
    entity_category: diagnostic

  - platform: uptime
    name: Uptime
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: ESPHome Version
    entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      name: IP Address
      entity_category: diagnostic
    mac_address:
      name: MAC Address
      entity_category: diagnostic
    scan_results:
      name: Wi-Fi Scan Results
      entity_category: diagnostic

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic

  - platform: safe_mode
    name: Restart in Safe Mode
    entity_category: diagnostic

# This is a mutable human label, not the ESPHome node hostname. The hostname
# stays unique through name_add_mac_suffix, while this value can be changed from
# the on-device web UI, Home Assistant, or POST /text/Device%20Alias/set.
text:
  - platform: template
    id: device_alias
    name: Device Alias
    icon: mdi:rename-box
    mode: text
    optimistic: true
    restore_value: true
    min_length: 1
    max_length: 32
    entity_category: config

# On first boot only, seed the alias from the final ESPHome node ID. Because
# name_add_mac_suffix is enabled this becomes "DBK A1B2C3". Restored user
# aliases are non-empty and are therefore never overwritten on later boots.
esphome:
  on_boot:
    - priority: -100
      then:
        - if:
            condition:
              lambda: return id(device_alias).state.empty();
            then:
              - text.set:
                  id: device_alias
                  value: !lambda |-
                    std::string node = App.get_name();
                    const size_t separator = node.rfind('-');
                    std::string suffix = separator == std::string::npos
                                           ? node
                                           : node.substr(separator + 1);
                    for (auto &character : suffix) {
                      character = static_cast<char>(toupper(character));
                    }
                    return "DBK " + suffix;
