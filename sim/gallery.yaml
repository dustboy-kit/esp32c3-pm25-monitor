# ─────────────────────────────────────────────────────────────────────────────
# THE PANEL.
#
# flip_x / flip_y match dbk.yaml — the DBK enclosure mounts the SSD1306 upside
# down. On a bare breadboard board the gallery will read upside down; drop both
# lines in that case. They are a hardware remap, so no lambda coordinate moves.
#
# The real panel refreshes at 20 FPS so millis()-driven motion matches the HTML
# gallery instead of stepping once per second. The logical surface remains the
# native 128x32 buffer: no scaling, offset, or hidden software margin.
# ─────────────────────────────────────────────────────────────────────────────
display:
- platform: ssd1306_i2c
  id: oled
  i2c_id: oled_bus
  model: SSD1306_128X32
  address: 0x3C
  update_interval: 50ms
  flip_x: true
  flip_y: true
  lambda: |-
    switch (id(screen_idx)) {

    // -- 0 - seg-clock - Segment Clock ----------------------------------------
    case 0: {
      const char *SEG[10] = {"1111110","0110000","1101101","1111001","0110011","1011011","1011111","1110000","1111111","1111011"};
      const int xs[4] = {2, 28, 62, 88};
      const int th = 4, w = 24, h = 28, vh = (28 - 3 * 4) / 2;
      int hh = 9, mi = 41;
      const auto tn = id(network_time).now();
      if (tn.is_valid()) { hh = tn.hour; mi = tn.minute; }
      const int dg[4] = {hh / 10, hh % 10, mi / 10, mi % 10};
      for (int i = 0; i < 4; i++) {
        const char *s = SEG[dg[i] % 10];
        const int x = xs[i], y = 2;
        if (s[0] == '1') it.filled_rectangle(x + th, y, w - 2 * th, th);
        if (s[1] == '1') it.filled_rectangle(x + w - th, y + th, th, vh);
        if (s[2] == '1') it.filled_rectangle(x + w - th, y + 2 * th + vh, th, vh);
        if (s[3] == '1') it.filled_rectangle(x + th, y + h - th, w - 2 * th, th);
        if (s[4] == '1') it.filled_rectangle(x, y + 2 * th + vh, th, vh);
        if (s[5] == '1') it.filled_rectangle(x, y + th, th, vh);
        if (s[6] == '1') it.filled_rectangle(x + th, y + th + vh, w - 2 * th, th);
      }
      const uint32_t t = millis();
      if (t % 1000 < 700) { it.filled_rectangle(53, 8, 4, 4); it.filled_rectangle(53, 20, 4, 4); }
      it.rectangle(116, 2, 10, 28);
      const int fh = (int) floorf(24.0f * fmodf(t / 1000.0f, 60.0f) / 60.0f + 0.5f);
      if (fh > 0) it.filled_rectangle(118, 28 - fh, 6, fh);
    } break;

    // -- 1 - outdoor-countdown - Outdoor Window -------------------------------
    case 1: {
      const uint32_t t = millis();
      const int total = 1500;
      const int left = total - (int) ((t / 100) % 1500);
      const int mm = left / 60, ss = left % 60;
      const float pm = id(pms_pm25).state;
      it.print(0, 0, id(font_label), TextAlign::TOP_LEFT, "OUTDOOR OK");
      it.printf(127, 0, id(font_label), TextAlign::TOP_RIGHT, "PM2.5 %.0f", std::isnan(pm) ? 12.0f : pm);
      it.horizontal_line(0, 9, 128);
      it.printf(61, 18, id(font_value), TextAlign::CENTER_RIGHT, "%02d", mm);
      it.printf(68, 18, id(font_value), TextAlign::CENTER_LEFT, "%02d", ss);
      it.filled_rectangle(63, 14, 3, 3);
      it.filled_rectangle(63, 21, 3, 3);
      const bool urgent = left <= 60;
      if (urgent && (t % 600) < 300) {
        it.filled_rectangle(0, 26, 128, 6);
      } else {
        it.rectangle(0, 26, 128, 6);
        const int w = (int) floorf(126.0f * left / total + 0.5f);
        if (w > 0) it.filled_rectangle(1, 27, w, 4);
      }
    } break;

    // -- 2 - pomo-dial - Pomodoro Dial ----------------------------------------
    case 2: {
      const uint32_t t = millis();
      const double p = (t % 30000) / 30000.0;
      const bool focus = p < 0.8333;
      const double phase = focus ? (p / 0.8333) : ((p - 0.8333) / 0.1667);
      int secs = (int) ceil((focus ? 1500.0 : 300.0) * (1.0 - phase));
      if (secs < 0) secs = 0;
      const int mm = secs / 60, ss = secs % 60;
      const int done = (int) ((t / 30000) % 4);
      const int lit = (int) floor(24.0 * phase + 0.5);
      const double PI_D = 3.141592653589793;
      for (int i = 0; i < 24; i++) {
        const double a = -PI_D / 2.0 + i * PI_D / 12.0;
        const int cx = 16 + (int) floor(13.0 * cos(a) + 0.5);
        const int cy = 16 + (int) floor(13.0 * sin(a) + 0.5);
        if (i < lit) it.filled_circle(cx, cy, 1); else it.draw_pixel_at(cx, cy);
      }
      const double ha = -PI_D / 2.0 + 2.0 * PI_D * phase;
      it.line(16, 16, 16 + (int) floor(9.0 * cos(ha) + 0.5), 16 + (int) floor(9.0 * sin(ha) + 0.5));
      it.print(36, 0, id(font_header), TextAlign::TOP_LEFT, focus ? "FOCUS" : "BREAK");
      it.printf(60, 21, id(font_value), TextAlign::CENTER_RIGHT, "%02d", mm);
      it.printf(67, 21, id(font_value), TextAlign::CENTER_LEFT, "%02d", ss);
      it.filled_rectangle(62, 17, 3, 3);
      it.filled_rectangle(62, 24, 3, 3);
      for (int k = 0; k < 4; k++) {
        if (k < done) it.filled_rectangle(97 + k * 8, 2, 7, 7);
        else it.rectangle(97 + k * 8, 2, 7, 7);
      }
    } break;

    // -- 3 - ota-marching - Marching Progress ---------------------------------
    case 3: {
      const uint32_t t = millis();
      const int pct = (int) ((t / 100) % 101);
      it.print(0, 0, id(font_label), TextAlign::TOP_LEFT, "OTA  dbk-c3-01");
      it.print(113, 1, id(font_label), TextAlign::TOP_RIGHT, pct < 100 ? "FLASHING" : "VERIFY");
      it.print(127, 0, id(font_icons), TextAlign::TOP_RIGHT,
               id(wifi_component).is_connected() ? "\U000F05A9" : "\U000F05AA");
      it.rectangle(0, 12, 84, 18);
      const int ix = 2, iy = 14, iw = 80, ih = 13;
      const int fw = (int) floorf(iw * pct / 100.0f + 0.5f);
      const int ph = (int) ((t / 60) % 6);
      for (int k = -ih + ph; k < fw; k += 6) {
        int ax = k, ay = 0, ex = k + ih, ey = ih;
        if (ax < 0) { ay = -ax; ax = 0; }
        if (ex > fw) { ey = fw - k; ex = fw; }
        if (ey > ay) it.line(ix + ax, iy + ay, ix + ex, iy + ey);
      }
      it.printf(114, 20, id(font_value), TextAlign::CENTER_RIGHT, "%d", pct);
      it.rectangle(117, 15, 3, 3);
      it.line(117, 24, 123, 16);
      it.rectangle(121, 22, 3, 3);
    } break;

    // -- 4 - week-and-day - Week and Day --------------------------------------
    case 4: {
      const char *DAYS[7] = {"SUN","MON","TUE","WED","THU","FRI","SAT"};
      const char *INI[7] = {"S","M","T","W","T","F","S"};
      const char *MON[12] = {"JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"};
      const auto tn = id(network_time).now();
      int today = 3, dom = 26, mon = 7, yr = 2026, base = 581;
      if (tn.is_valid()) {
        today = (tn.day_of_week >= 1 && tn.day_of_week <= 7) ? (tn.day_of_week - 1) : 3;
        mon = (tn.month >= 1 && tn.month <= 12) ? (tn.month - 1) : 7;
        dom = tn.day_of_month; yr = tn.year; base = tn.hour * 60 + tn.minute;
      }
      it.print(2, 0, id(font_header), TextAlign::TOP_LEFT, DAYS[today]);
      it.printf(43, 1, id(font_label), TextAlign::TOP_RIGHT, "%d", yr);
      it.printf(2, 12, id(font_value), TextAlign::TOP_LEFT, "%02d", dom);
      it.print(22, 17, id(font_label), TextAlign::TOP_LEFT, MON[mon]);
      it.vertical_line(45, 0, 26);
      for (int i = 0; i < 7; i++) {
        const int cx = 48 + i * 11;
        it.print(cx + 5, 0, id(font_label), TextAlign::TOP_CENTER, INI[i]);
        const int dn = dom - today + i;
        if (dn >= 1 && dn <= 31) it.printf(cx + 5, 11, id(font_label), TextAlign::TOP_CENTER, "%d", dn);
        if (i == today) it.rectangle(cx, 0, 11, 21);
      }
      const uint32_t t = millis();
      const int mins = (base + (int) ((t / 100) % 1440)) % 1440;
      it.horizontal_line(0, 29, 128);
      for (int h = 0; h <= 24; h += 6) { const int vx = h * 127 / 24; it.vertical_line(vx > 126 ? 126 : vx, 27, 3); }
      const int mx = (int) floorf(124.0f * mins / 1440.0f + 0.5f);
      if (mx > 0) it.horizontal_line(0, 31, mx + 3);
      it.filled_rectangle(mx, 26, 3, 6);
    } break;

    // -- 5 - mood-face - Air Face ---------------------------------------------
    case 5: {
      const uint32_t t = millis();
      float pmf = id(pms_pm25).state;
      if (std::isnan(pmf) || pmf < 0.0f) pmf = 0.0f;
      float m = 1.0f - pmf / 35.0f;
      if (m > 1.0f) m = 1.0f;
      if (m < -1.0f) m = -1.0f;
      it.circle(16, 16, 15);
      const int gx = (int) roundf(1.4f * sinf(t / 900.0f));
      const int gy = (int) roundf(1.2f * sinf(t / 1300.0f));
      if ((t % 3400) < 150) {
        it.horizontal_line(8, 12, 7); it.horizontal_line(18, 12, 7);
      } else {
        it.circle(11, 12, 3); it.circle(21, 12, 3);
