      // so the caption goes to font_label and the number is clamped non-negative
      // before it is printed. A blank panel would look like a dead board.
      int bad = id(screen_idx);
      if (bad < 0) bad = 0;
      if (bad > 9999) bad = 9999;
      it.rectangle(0, 0, 128, 32);
      it.print(64, 4, id(font_label), TextAlign::TOP_CENTER, "SCREEN INDEX");
      it.printf(64, 14, id(font_value), TextAlign::TOP_CENTER, "%d", bad);
    } break;
    }
