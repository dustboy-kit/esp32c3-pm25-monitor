# ─────────────────────────────────────────────────────────────────────────────
# DBK SCREEN GALLERY — one firmware, all 30 designs, cycling every 5 seconds.
#
# The point of this file is that a SINGLE compile proves every lambda and a
# SINGLE flash puts the whole gallery on real glass. A design that only ever
# ran in the simulator has not been proven: the failure this gallery exists to
# catch — a character outside a font's glyph set — renders as a hollow box on
# hardware, silently, with no error and no log.
#
# Hardware: ESP32-C3 + SSD1306 128x32 mono OLED (i2c sda 9 / scl 10, addr 0x3C)
#           + optional PMS7003 on uart rx 6 / tx 7. Same pinout as `dbk`.
#
# ⚠ NO CREDENTIALS LIVE HERE, BY DESIGN.
#   ~/.haos-oracle/lab/dbk.yaml is a RESOLVED config with real WiFi/API/OTA
#   secrets inlined. Nothing was copied from it except hardware blocks. There is
#   no wifi network, no api and no ota in this file, so it is safe to commit and
#   safe to share. See sim/README.md for how to add credentials locally if you
#   want the gallery on the network.
#
# ⚠ NO SENSOR REQUIRED. Every lambda was audited for the NaN case, so a bare
#   ESP32-C3 + OLED with no PMS7003 attached renders all 30 screens with zeros
#   rather than the hollow boxes "nan" would produce in font_value.
# ─────────────────────────────────────────────────────────────────────────────

substitutions:
  device_name: dbk-gallery
  friendly_name: DBK Gallery
  initial_screen: '0'
  # -1 cycles through all screens; 0..29 pins one Canvas design for flashing.
  selected_screen: '-1'

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.6.5
  project:
    name: dustboy-kit.dbk-gallery
    version: 0.1.0

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  flash_size: 4MB
  framework:
    type: arduino

# USB_SERIAL_JTAG keeps the hardware UART free for the PMS7003 on GPIO6/7.
logger:
  hardware_uart: USB_SERIAL_JTAG
  # DEBUG, not INFO: the serial->MQTT bridge on the host greps
  # 'PM2.5 Concentration: N', which pmsx003 only emits at DEBUG. At INFO a
  # board running the gallery goes quietly stale in Home Assistant while the
  # bridge sits there looking perfectly healthy. ESPHome also refuses a
  # per-component level more verbose than the global one, so it has to be here.
  level: DEBUG
  baud_rate: 115200

# Declared, but never switched on. Four screens call
# id(wifi_component).is_connected(), so the component has to EXIST — and a
# `wifi:` block will not validate without either a network or an AP, while a
# network would mean credentials in a committed file. So: an AP to satisfy the
# schema, plus enable_on_boot:false so no radio ever comes up and no open access
# point is broadcast from a device that sits in a classroom. is_connected() is
# therefore always false, which is honest — this board has no uplink.
# ESPHome will warn that the AP is unusable without captive_portal. Expected:
# it is not meant to be used.
wifi:
  id: wifi_component
  enable_on_boot: false
  ap:
    ssid: DBK-GALLERY
  on_connect:
    then:
    - globals.set:
        id: wifi_disconnected_since_ms
        value: '0'
  on_disconnect:
    then:
    - lambda: |-
        if (id(wifi_disconnected_since_ms) == 0) {
          id(wifi_disconnected_since_ms) = millis();
        }

# Wi-Fi provisioning from a browser, over the same USB cable used to flash.
#
# This was in dbk.yaml all along and got dropped when the gallery was assembled
# from its hardware blocks — silently, because nothing fails and the screen
# still draws. Flashing a gallery build without this REMOVES the ability to set
# the board's Wi-Fi without already knowing the password, which is exactly the
# situation DBK-002 has been stuck in: its stored credential is stale, the radio
# is fine, and only authentication fails.
#
# authorizer: none is deliberate. It was originally set to clear a validation
# error and had the unplanned benefit that Improv reaches AUTHORIZED with no
# physical button press — which matters on a board whose only button is the
# strapping pin.
improv_serial: {}
esp32_improv:
  authorizer: none
  identify_duration: 10s
  authorized_duration: 1min
  wifi_timeout: 90s

# Screens 0 and 4 read the clock. With no uplink it never syncs, and both fall
# back to their designed constants (09:41 and WED 26 AUG 2026) rather than
# blanking — that fallback path is exactly what this gallery should show.
time:
- platform: sntp
  id: network_time
  timezone: Asia/Bangkok
  update_interval: 15min

i2c:
  id: oled_bus
  sda: 9
  scl: 10
  frequency: 400kHz
  scan: true

uart:
- id: pms_uart
  rx_pin: 6
  tx_pin: 7
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 256

# The PMS7003 sleeps unless SET is held high; RESET high keeps it out of reset.
switch:
- platform: gpio
  id: pms_set
  name: PMS7003 Set
  internal: true
  restore_mode: ALWAYS_ON
  pin: 5
- platform: gpio
  id: pms_reset
  name: PMS7003 Reset
  internal: true
  restore_mode: ALWAYS_ON
  pin:
    number: 8
    ignore_strapping_warning: true

globals:
# Which of the 30 designs is on the panel. Not restored: a gallery should always
# open on screen 0 so a demo is reproducible.
- id: screen_idx
  type: int
  restore_value: false
  initial_value: '${initial_screen}'
# Screens 12 and 19 read this one.
- id: mqtt_connected
  type: bool
  restore_value: false
  initial_value: 'false'
# Carried at parity with dbk.yaml so a lambda can move between the two configs
# without edits. No screen in this gallery reads them today.
- id: last_pms_update_ms
  type: uint32_t
  restore_value: false
  initial_value: '0'
- id: wifi_disconnected_since_ms
  type: uint32_t
  restore_value: false
  initial_value: '0'

sensor:
- platform: pmsx003
  type: PMSX003
  uart_id: pms_uart
  update_interval: 0s
  pm_1_0:
    id: pms_pm1
    name: PM1.0
    accuracy_decimals: 0
    unit_of_measurement: "µg/m³"
    device_class: pm1
    state_class: measurement
  pm_2_5:
    id: pms_pm25
    name: PM2.5
    accuracy_decimals: 0
    unit_of_measurement: "µg/m³"
    device_class: pm25
    state_class: measurement
    on_value:
    - then:
      - lambda: 'id(last_pms_update_ms) = millis();'
  pm_10_0:
    id: pms_pm10
    name: PM10
    accuracy_decimals: 0
    unit_of_measurement: "µg/m³"
    device_class: pm10
    state_class: measurement

interval:
# The gallery itself: advance one design every 5 seconds, wrap at 30.
- interval: 5s
  then:
  - lambda: |-
      if (${selected_screen} >= 0) {
        id(screen_idx) = ${selected_screen};
      } else {
        id(screen_idx) = (id(screen_idx) + 1) % 30;
      }

# GALLERY ONLY — delete this block to make the gallery purely passive.
# There is no mqtt: client in this firmware, so mqtt_connected would sit false
# forever and the connected branches of screens 12 (Three Columns) and 19 (Eight
# Up Board) would never appear on real glass. Toggling it every ~17s makes both
# branches observable. The shipped DBK firmware does nothing like this.
- interval: 1s
  then:
  - lambda: 'id(mqtt_connected) = ((millis() / 17000UL) % 2) == 0;'

# ─────────────────────────────────────────────────────────────────────────────
# THE FOUR FONTS — glyph coverage is a hard limit, not a suggestion.
# A character outside these sets renders as a hollow missing-glyph box, with no
# error and no log. ignore_missing_glyphs stays false everywhere so a bad glyph
# is caught at COMPILE time instead of on a child's desk.
#
#   font_header  Roboto Mono 10px  116 glyphs, full ASCII + typographic extras
#   font_label   Roboto Mono  7px  116 glyphs, full ASCII + typographic extras
#   font_icons   Material Design Icons 10px  ONLY U+F05A9 / U+F05AA (wifi)
#   font_value   Open Sans   10px  ONLY " 0123456789" — no '.', '-', ':', '%',
#                                  no letters. Everything else is a primitive.
#
# Reproduced from the resolved dbk.yaml so the gallery's pixels are the shipped
# device's pixels.
# ─────────────────────────────────────────────────────────────────────────────
