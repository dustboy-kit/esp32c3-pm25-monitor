substitutions:
  name: dbk
  friendly_name: DBK
  device_id: DBK
  name_add_mac_suffix: 'true'
  project_version: 0.1.0
  good_limit: '25'
  fair_limit: '50'
  splash_seconds: '3'
  wifi_ap_timeout_seconds: '90'
  wifi_ap_active_timeout_minutes: '15'
  wifi_reboot_timeout: 990s
  timezone: Asia/Bangkok
  warmup_seconds: '30'
  stale_seconds: '10'
esphome:
  name: dbk
  friendly_name: DBK
  name_add_mac_suffix: true
  min_version: 2026.6.5
  project:
    name: dustboy-kit.dbk
    version: 0.1.0
  build_path: build/dbk
  platformio_options: {}
  build_flags:
  - -include src/sim_shim.h
  environment_variables: {}
  includes:
  - sim_shim.h
  includes_c: []
  libraries: []
  merge_warnings: true
  debug_scheduler: false
  areas: []
  devices: []
host:
logger:
  level: DEBUG
  logs: {}
api:
  port: 6053
  reboot_timeout: 15min
  batch_delay: 100ms
  custom_services: false
  homeassistant_services: false
  homeassistant_states: false
  listen_backlog: 4
  max_connections: 5
  max_send_queue: 8
time:
- platform: host
  id: network_time
  timezone: <+07>-7
uart:
- id: pms_uart
  port: /dev/ttys000
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 256
switch:
- platform: gpio
  id: pms_set
  name: PMS7003 Set
  internal: true
  restore_mode: ALWAYS_ON
  pin:
    number: 5
    mode:
      output: true
      input: false
      open_drain: false
      pullup: false
      pulldown: false
    inverted: false
  disabled_by_default: false
  interlock_wait_time: 0ms
- platform: gpio
  id: pms_reset
  name: PMS7003 Reset
  internal: true
  restore_mode: ALWAYS_ON
  pin:
    number: 8
    mode:
      output: true
      input: false
      open_drain: false
      pullup: false
      pulldown: false
    inverted: false
  disabled_by_default: false
  interlock_wait_time: 0ms
globals:
- id: wifi_component
  type: WifiShim
  restore_value: false
  initial_value: WifiShim{}
# Which of gallery.yaml's 30 designs is on the panel. `just lab-sim gallery`
# lifts only the DISPLAY LAMBDA out of a device config, never its globals or
# intervals — so the gallery's switch would not compile here without this pair.
# Unused and harmless when simulating dbk itself.
- id: screen_idx
  type: int
  restore_value: false
  initial_value: '0'
- id: last_pms_update_ms
  type: uint32_t
  restore_value: false
  initial_value: '0'
- id: mqtt_connected
  type: bool
  restore_value: false
  initial_value: 'false'
- id: wifi_disconnected_since_ms
  type: uint32_t
  restore_value: false
  initial_value: '0'
sensor:
- platform: pmsx003
  type: PMSX003
  uart_id: pms_uart
  pm_1_0:
    id: pms_pm1
    name: PM1.0
    accuracy_decimals: 0
    disabled_by_default: false
    force_update: false
    unit_of_measurement: µg/m³
    icon: mdi:chemical-weapon
    device_class: pm1
    state_class: measurement
  pm_2_5:
    id: pms_pm25
    name: PM2.5
    accuracy_decimals: 0
    on_value:
    - then:
      - lambda: |-
          id(last_pms_update_ms) = millis();
          if (millis() < (30 * 1000UL)) {
            return;
          }

          if (x <= 25) {
            id(air_quality_level).publish_state("GOOD");
          } else if (x <= 50) {
            id(air_quality_level).publish_state("FAIR");
          } else {
            id(air_quality_level).publish_state("BAD");
          }
    disabled_by_default: false
    force_update: false
    unit_of_measurement: µg/m³
    icon: mdi:chemical-weapon
    device_class: pm25
    state_class: measurement
  pm_10_0:
    id: pms_pm10
    name: PM10
    accuracy_decimals: 0
    disabled_by_default: false
    force_update: false
    unit_of_measurement: µg/m³
    icon: mdi:chemical-weapon
    device_class: pm10
    state_class: measurement
  update_interval: 0s
- platform: uptime
  name: Uptime
  update_interval: 60s
  entity_category: diagnostic
  disabled_by_default: false
  force_update: false
  unit_of_measurement: s
  icon: mdi:timer-outline
  accuracy_decimals: 0
  device_class: duration
  state_class: total_increasing
  type: seconds
text_sensor:
- platform: template
  id: air_quality_level
  name: Air Quality Level
  icon: mdi:air-filter
  update_interval: 4294967295ms
  disabled_by_default: false
- platform: version
  name: ESPHome Version
  entity_category: diagnostic
  disabled_by_default: false
  icon: mdi:new-box
  hide_hash: false
  hide_timestamp: false
interval:
# ---- SIMULATOR ONLY: stand in for the PMS7003 -------------------------------
# There is no sensor on the other end of a host-platform uart, so without this
# every screen parks on its sensor-error branch and the simulator shows nothing
# worth looking at. Publishing directly to the sensor ids drives the real
# on_value handlers, so last_pms_update_ms is maintained exactly as it is on
# hardware and the staleness logic stays honest.
#
# The value sweeps 0..160 over two minutes rather than sitting still, so a
# design gets exercised across every AQI band, at one and two and three digits
# — the widths that break a layout. Nothing here is copied into firmware:
# tools/lab-sim.py only lifts the display lambda out of a device config, so
# this block exists in the simulator and nowhere else.
- interval: 1s
  then:
  - lambda: |-
      const float phase = (millis() % 120000UL) / 120000.0f;
      const float pm25 = 80.0f * (1.0f - cosf(phase * 6.2831853f));
      id(pms_pm1).publish_state(pm25 * 0.62f);
      id(pms_pm25).publish_state(pm25);
      id(pms_pm10).publish_state(pm25 * 1.45f);
      // Flip the link indicators occasionally so the wifi / mqtt branches and
      // the reconnect countdown are reachable without unplugging anything.
      const uint32_t t = millis() / 1000UL;
      id(mqtt_connected) = ((t / 17) % 2) == 0;
      id(wifi_component).connected = ((t / 41) % 4) != 3;
      if (!id(wifi_component).connected) {
        if (id(wifi_disconnected_since_ms) == 0) id(wifi_disconnected_since_ms) = millis();
      } else {
        id(wifi_disconnected_since_ms) = 0;
      }
  startup_delay: 2s

# Drives gallery.yaml's screen cycle at the same 5s cadence the firmware uses,
# so the simulator walks the same 30 designs in the same order. Inert for dbk,
# whose lambda never reads screen_idx.
- interval: 5s
  then:
  - lambda: 'id(screen_idx) = (id(screen_idx) + 1) % 30;'

- interval: 1s
  then:
  - if:
      condition:
        lambda: |-
          return millis() < (30 * 1000UL);
      then:
      - text_sensor.template.publish:
          id: air_quality_level
          state: CHECKING SENSOR...
      else:
      - if:
          condition:
            lambda: |-
              return id(last_pms_update_ms) == 0 ||
                     (uint32_t) (millis() - id(last_pms_update_ms)) > (10 * 1000UL);
          then:
          - text_sensor.template.publish:
              id: air_quality_level
              state: SENSOR ERROR
  startup_delay: 0s
