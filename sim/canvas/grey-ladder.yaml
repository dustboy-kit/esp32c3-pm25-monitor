# ─────────────────────────────────────────────────────────────────────────────
# THE PANEL.
#
# flip_x / flip_y match dbk.yaml — the DBK enclosure mounts the SSD1306 upside
# down. On a bare breadboard board the gallery will read upside down; drop both
# lines in that case. They are a hardware remap, so no lambda coordinate moves.
#
# The real panel refreshes at 20 FPS so millis()-driven motion matches the HTML
# gallery instead of stepping once per second. The logical surface remains the
# native 128x32 buffer: no scaling, offset, or hidden software margin.
# ─────────────────────────────────────────────────────────────────────────────

# Adopt the complete editable file in ESPHome Device Builder. To rename
# the node, follow ESPHome's two-step name/use_address migration.
dashboard_import:
  package_import_url: github://dustboy-kit/esp32c3-pm25-monitor/sim/canvas/grey-ladder.yaml@main
  import_full_config: true

display:
- platform: ssd1306_i2c
  id: oled
  i2c_id: oled_bus
  model: SSD1306_128X32
  address: 0x3C
  update_interval: 50ms
  flip_x: true
  flip_y: true
  lambda: |-
    static const uint8_t B[16] = {0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5};
    static const uint8_t LV[6] = {1,2,4,8,12,16};
    static const char *const NM[6] = {"1/16","1/8","1/4","1/2","3/4","ALL"};
    static const char *const VD[5] = {"MUSH","FAINT","CLEAR","CLEAR","MUSH"};
    const int p = (int) ((millis() / 1500UL) % 5UL);
    it.printf(0, 0, id(font_label), TextAlign::TOP_LEFT, "%s v %s", NM[p], NM[p + 1]);
    it.print(127, 0, id(font_label), TextAlign::TOP_RIGHT, VD[p]);
    for (int i = 0; i < 6; i++) {
      const int x0 = 2 + i * 21;
      for (int x = x0; x < x0 + 19; x++)
        for (int y = 10; y < 26; y++)
          if (B[(y & 3) * 4 + (x & 3)] < LV[i]) it.draw_pixel_at(x, y);
    }
    const int bx = 2 + p * 21;
    it.horizontal_line(bx, 29, 40);
    it.vertical_line(bx, 27, 3);
    it.vertical_line(bx + 39, 27, 3);
    it.vertical_line(bx + 20, 27, 2);
