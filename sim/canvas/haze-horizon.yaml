# Generated by tools/canvas-firmware.py; edit the Canvas source, not this file.
# Standalone Canvas example: Haze Horizon (haze-horizon)
# Compile directly: esphome compile sim/canvas/haze-horizon.yaml
# Rename: edit esphome.name; set name_add_mac_suffix false for an exact name.

esphome:
  name: dbk-canvas
  friendly_name: DBK Canvas
  # One factory image can be flashed to many boards without mDNS/API clashes.
  name_add_mac_suffix: true
  min_version: 2026.6.5
  project:
    name: dustboy-kit.dbk-gallery
    version: 0.2.0
  on_boot:
  - priority: -100
    then:
    - if:
        condition:
          lambda: return id(device_alias).state.empty();
        then:
        - text.set:
            id: device_alias
            value: !lambda |-
              std::string node = App.get_name();
              const size_t separator = node.rfind('-');
              std::string suffix = separator == std::string::npos
                                     ? node
                                     : node.substr(separator + 1);
              for (auto &character : suffix) {
                character = static_cast<char>(toupper(character));
              }
              return "DBK " + suffix;
  # Priority 600: text values are restored (800) but Wi-Fi/MQTT not set up
  # yet (250), so the seeded kit id reaches the first MQTT connect.
  - priority: 600
    then:
    - if:
        condition:
          lambda: return id(kit_id).state.empty();
        then:
        - text.set:
            id: kit_id
            value: !lambda |-
              std::string mac = get_mac_address();  // aabbccddeeff
              std::string tail = mac.size() >= 4 ? mac.substr(mac.size() - 4) : mac;
              for (auto &c : tail) {
                c = static_cast<char>(toupper(c));
              }
              return "DBK-" + tail;
  # After all components are set up (MQTT starts disabled: enable_on_boot
  # false). The restored password's on_value ran before MQTT existed, so the
  # client is switched on here when a password is stored.
  - priority: -100
    then:
    - if:
        condition:
          lambda: return !id(mqtt_password).state.empty();
        then:
        - mqtt.enable:

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  flash_size: 4MB
  framework:
    type: arduino

# USB_SERIAL_JTAG keeps the hardware UART free for the PMS7003 on GPIO6/7.
logger:
  hardware_uart: USB_SERIAL_JTAG
  # DEBUG, not INFO: the serial->MQTT bridge on the host greps
  # 'PM2.5 Concentration: N', which pmsx003 only emits at DEBUG. At INFO a
  # board running the gallery goes quietly stale in Home Assistant while the
  # bridge sits there looking perfectly healthy. ESPHome also refuses a
  # per-component level more verbose than the global one, so it has to be here.
  level: DEBUG
  baud_rate: 115200
  logs:
    # A hosted HTTPS dashboard can lose its HTTP/SSE connection to the board.
    # Keep useful PMS DEBUG lines without repeating ENOTCONN for the dead socket.
    web_server_idf: WARN

# Export PM1, PM2.5 and PM10 entities over Wi-Fi to Home Assistant or another
# ESPHome native-API client. No static credential is baked into public firmware.
api:
  reboot_timeout: 0s

# Required for an adopted Device Builder config to rename/update the node over
# Wi-Fi after its initial USB flash.
ota:
- platform: esphome

# No credentials are baked in. Provision Wi-Fi over USB with Improv Serial, over
# BLE with ESP32 Improv, or through the fallback captive portal. Credentials are
# persisted by ESPHome and used again after reboot.
wifi:
  id: wifi_component
  # Proven on the target ESP32-C3: the default 20 dBm repeatedly timed out
  # during WPA authentication, while 8.5 dBm associated immediately.
  output_power: 8.5dBm
  power_save_mode: none
  passive_scan: false
  # Off: with fast_connect a provisioned kit never scans, so Improv's network
  # list is empty (verified 2026-11-06). Scan-based connect picks the best AP.
  fast_connect: false
  # Accept WPA/WPA2/WPA3 so field devices can join older 2.4 GHz routers.
  min_auth_mode: WPA
  ap:
    ssid: DBK-Canvas Setup
  on_connect:
    then:
    - globals.set:
        id: wifi_disconnected_since_ms
        value: '0'
  on_disconnect:
    then:
    - lambda: |-
        if (id(wifi_disconnected_since_ms) == 0) {
          id(wifi_disconnected_since_ms) = millis();
        }

# Wi-Fi provisioning from a browser, over the same USB cable used to flash.
#
# This was in dbk.yaml all along and got dropped when the gallery was assembled
# from its hardware blocks — silently, because nothing fails and the screen
# still draws. Flashing a gallery build without this REMOVES the ability to set
# the board's Wi-Fi without already knowing the password, which is exactly the
# situation DBK-002 has been stuck in: its stored credential is stale, the radio
# is fine, and only authentication fails.
#
# authorizer: none is deliberate. It was originally set to clear a validation
# error and had the unplanned benefit that Improv reaches AUTHORIZED with no
# physical button press — which matters on a board whose only button is the
# strapping pin.
# DustBoy fork of improv_serial (Kit ID + MQTT password over USB). Path is
# relative to sim/canvas/, where tools/canvas-firmware.py writes the compiled copies.
external_components:
  - source:
      type: local
      path: ../../components

improv_serial:
  next_url: "https://dustboy-kit.github.io/esp32c3-pm25-monitor/dashboard/?host={{device_name}}.local"
  kit_id_text: kit_id
  mqtt_password_text: mqtt_password
esp32_improv:
  authorizer: none
  identify_duration: 10s
  authorized_duration: 1min
  wifi_timeout: 90s

# Fallback provisioning path when BLE or serial Improv is not convenient.
captive_portal:

# A complete ESPHome dashboard is embedded in every standalone Canvas image.
# It exposes the same entities as JSON REST endpoints and live /events SSE.
# The public Pages dashboard talks to this API directly on the local network.
web_server:
  version: 3
  include_internal: false
  # The kit serves its own small dashboard (web/kit-dashboard.js, gzipped into
  # flash) instead of the stock ESPHome UI, so http://<kit>/ shows PM values on
  # any browser in the same Wi-Fi. REST JSON and /events stay available.
  local: false
  js_url: ""
  js_include: ../../web/kit-dashboard.js
  enable_private_network_access: true
  ota: false
  log: false

# Screens 0 and 4 read the clock. With no uplink it never syncs, and both fall
# back to their designed constants (09:41 and WED 26 AUG 2026) rather than
# blanking — that fallback path is exactly what this gallery should show.
time:
- platform: sntp
  id: network_time
  timezone: Asia/Bangkok
  update_interval: 15min

i2c:
  id: oled_bus
  sda: 9
  scl: 10
  frequency: 400kHz
  scan: true

uart:
- id: pms_uart
  rx_pin: 6
  tx_pin: 7
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 256

# The PMS7003 sleeps unless SET is held high; RESET high keeps it out of reset.
switch:
- platform: gpio
  id: pms_set
  name: PMS7003 Set
  internal: true
  restore_mode: ALWAYS_ON
  pin: 5
- platform: gpio
  id: pms_reset
  name: PMS7003 Reset
  internal: true
  restore_mode: ALWAYS_ON
  pin:
    number: 8
    ignore_strapping_warning: true

globals:
# Screens 12 and 19 read this one.
- id: mqtt_connected
  type: bool
  restore_value: false
  initial_value: 'false'
# Carried at parity with dbk.yaml so a lambda can move between the two configs
# without edits. No screen in this gallery reads them today.
- id: last_pms_update_ms
  type: uint32_t
  restore_value: false
  initial_value: '0'
- id: wifi_disconnected_since_ms
  type: uint32_t
  restore_value: false
  initial_value: '0'

sensor:
- platform: pmsx003
  type: PMSX003
  uart_id: pms_uart
  update_interval: 0s
  pm_1_0:
    id: pms_pm1
    name: PM1.0
    accuracy_decimals: 0
    unit_of_measurement: "µg/m³"
    device_class: pm1
    state_class: measurement
  pm_2_5:
    id: pms_pm25
    name: PM2.5
    accuracy_decimals: 0
    unit_of_measurement: "µg/m³"
    device_class: pm25
    state_class: measurement
    on_value:
    - then:
      - lambda: 'id(last_pms_update_ms) = millis();'
  pm_10_0:
    id: pms_pm10
    name: PM10
    accuracy_decimals: 0
    unit_of_measurement: "µg/m³"
    device_class: pm10
    state_class: measurement

- platform: wifi_signal
  id: wifi_rssi
  name: Wi-Fi RSSI
  update_interval: 30s
  entity_category: diagnostic

- platform: uptime
  id: device_uptime
  name: Uptime
  update_interval: 60s
  entity_category: diagnostic

text_sensor:
- platform: version
  id: esphome_version
  name: ESPHome Version
  entity_category: diagnostic

- platform: wifi_info
  ip_address:
    id: device_ip
    name: IP Address
    entity_category: diagnostic
  mac_address:
    id: device_mac
    name: MAC Address
    entity_category: diagnostic

# Fleet MQTT, configured at runtime so one image serves every kit (same block as
# packages/mqtt.yaml; kept inline because tools/canvas-firmware.py forbids
# includes). Kit ID and MQTT Password are text entities stored on the board and
# set from the Wi-Fi setup page. The client stays disabled until a password is
# stored. Topics: DUSTBOY/DBK/<Kit ID>/status (JSON, 30 s) and .../lwt.
mqtt:
  id: mqtt_client
  broker: mqtt.laris.co
  port: 1883
  username: dbk
  password: ""
  enable_on_boot: false
  discovery: false
  log_topic:
  topic_prefix: null
  reboot_timeout: 0s
  on_connect:
  - globals.set:
      id: mqtt_connected
      value: 'true'
  on_disconnect:
  - globals.set:
      id: mqtt_connected
      value: 'false'

# Mutable label for classrooms and fleets. This does not change the unique
# dbk-canvas-xxxxxx hostname and therefore cannot create an mDNS/API collision.
text:
- platform: template
  id: device_alias
  name: Device Alias
  icon: mdi:rename-box
  mode: text
  optimistic: true
  restore_value: true
  min_length: 1
  max_length: 32
  entity_category: config

- platform: template
  id: kit_id
  name: Kit ID
  icon: mdi:identifier
  mode: text
  optimistic: true
  restore_value: true
  min_length: 1
  max_length: 24
  entity_category: config
  on_value:
  - lambda: |-
      const std::string lwt = "DUSTBOY/DBK/" + x + "/lwt";
      id(mqtt_client).set_birth_message({lwt, "online", 0, true});
      id(mqtt_client).set_last_will({lwt, "offline", 0, true});
      if (id(mqtt_client).is_connected()) {
        id(mqtt_client).publish(lwt, "online", 0, true);
      }
      // The alias defaults to the kit id until someone types their own.
      const std::string &alias = id(device_alias).state;
      if (alias.empty() || alias.rfind("DBK-", 0) == 0 || alias.rfind("DBK ", 0) == 0) {
        id(device_alias).make_call().set_value(x).perform();
      }

- platform: template
  id: mqtt_password
  name: MQTT Password
  icon: mdi:key-variant
  mode: password
  optimistic: true
  restore_value: true
  min_length: 0
  max_length: 64
  entity_category: config
  on_value:
  - lambda: |-
      id(mqtt_client).set_password(x);
      // Restored during boot before MQTT is set up: leave it to on_boot -100.
      if (!id(mqtt_client).is_ready()) {
        return;
      }
      if (x.empty() && id(mqtt_client).is_connected()) {
        // Leave a clean retained state behind before switching off.
        id(mqtt_client).publish("DUSTBOY/DBK/" + id(kit_id).state + "/lwt", "offline", 0, true);
      }
      id(mqtt_client).disable();
      if (!x.empty()) {
        id(mqtt_client).enable();
      }

button:
- platform: restart
  name: Restart
  entity_category: diagnostic

- platform: safe_mode
  name: Restart in Safe Mode
  entity_category: diagnostic

interval:
# GALLERY ONLY marker: tools/canvas-firmware.py cuts the rotation above this
# line and keeps everything below it in every standalone Canvas image.
# One JSON snapshot per 30 s on DUSTBOY/DBK/<Kit ID>/status for the CCDC
# collector (00_mz_forwarder 030_model_dbk.yml). Only while MQTT is connected.
- interval: 30s
  then:
  - if:
      condition:
        mqtt.connected:
      then:
      - mqtt.publish_json:
          topic: !lambda return "DUSTBOY/DBK/" + id(kit_id).state + "/status";
          retain: false
          payload: |-
            JsonObject info = root["info"].to<JsonObject>();
            info["mac"] = id(device_mac).state;
            info["ip"] = id(device_ip).state;
            info["version"] = "0.2.0";
            info["device_id"] = id(kit_id).state;
            JsonObject d = root["d"].to<JsonObject>();
            d["myName"] = id(kit_id).state;
            d["alias"] = id(device_alias).state;
            d["pm1"] = id(pms_pm1).state;
            d["pm2_5"] = id(pms_pm25).state;
            d["pm10"] = id(pms_pm10).state;
            d["rssi"] = id(wifi_rssi).state;
            d["uptime_s"] = millis() / 1000UL;

# ─────────────────────────────────────────────────────────────────────────────
# THE FOUR FONTS — glyph coverage is a hard limit, not a suggestion.
# A character outside these sets renders as a hollow missing-glyph box, with no
# error and no log. ignore_missing_glyphs stays false everywhere so a bad glyph
# is caught at COMPILE time instead of on a child's desk.
