# ─────────────────────────────────────────────────────────────────────────────
# THE PANEL.
#
# flip_x / flip_y match dbk.yaml — the DBK enclosure mounts the SSD1306 upside
# down. On a bare breadboard board the gallery will read upside down; drop both
# lines in that case. They are a hardware remap, so no lambda coordinate moves.
#
# The real panel refreshes at 20 FPS so millis()-driven motion matches the HTML
# gallery instead of stepping once per second. The logical surface remains the
# native 128x32 buffer: no scaling, offset, or hidden software margin.
# ─────────────────────────────────────────────────────────────────────────────

# Adopt the complete editable file in ESPHome Device Builder. To rename
# the node, follow ESPHome's two-step name/use_address migration.
dashboard_import:
  package_import_url: github://dustboy-kit/esp32c3-pm25-monitor/sim/canvas/haze-horizon.yaml@main
  import_full_config: true

display:
- platform: ssd1306_i2c
  id: oled
  i2c_id: oled_bus
  model: SSD1306_128X32
  address: 0x3C
  update_interval: 50ms
  flip_x: true
  flip_y: true
  lambda: |-
    static const uint8_t B[16] = {0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5};
    float pmf = id(pms_pm25).state;
    if (std::isnan(pmf) || pmf < 0.0f) pmf = 0.0f;
    if (pmf > 999.0f) pmf = 999.0f;
    const int pm = (int) roundf(pmf);
    int lmax = (int) roundf(4.0f + pmf / 5.0f);
    if (lmax > 16) lmax = 16;
    const int hc = 12 + (int) roundf(2.0f * sinf(millis() / 2600.0f));
    it.printf(2, 0, id(font_label), TextAlign::TOP_LEFT, "PM2.5 %d", pm);
    it.print(126, 0, id(font_label), TextAlign::TOP_RIGHT, "INVERSION");
    for (int x = 0; x < 128; x++) {
      const float h1 = (x > 12 && x < 64) ? 9.0f * (0.5f + 0.5f * cosf((x - 38) / 26.0f * 3.14159265f)) : 0.0f;
      const float h2 = (x > 68 && x < 112) ? 5.0f * (0.5f + 0.5f * cosf((x - 90) / 22.0f * 3.14159265f)) : 0.0f;
      const int ry = 27 - (int) roundf(h1 + h2);
      for (int y = hc; y < ry; y++) {
        const int lv = (int) roundf(lmax * (float) (y - hc) / (float) (27 - hc));
        if (lv > 0 && B[(y & 3) * 4 + (x & 3)] < lv) it.draw_pixel_at(x, y);
      }
      it.vertical_line(x, ry, 32 - ry);
      if (x % 4 == 0) it.draw_pixel_at(x, hc - 1);
    }
