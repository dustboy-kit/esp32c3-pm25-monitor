# Generated by tools/canvas-firmware.py; edit the Canvas source, not this file.
# Canvas example: Animated Sweep (animation)
substitutions:
  device_name: dbk-canvas
  friendly_name: DBK Canvas
  initial_screen: '0'
  selected_screen: '0'
packages:
  hardware_and_gallery: !include ../gallery.yaml
display:
- id: !extend oled
  lambda: |-
    it.print(64, 0, id(font_header), TextAlign::TOP_CENTER, "LIVE SWEEP");
    it.horizontal_line(0, 12, 128);
    int x = (millis() / 18) % 128;
    it.vertical_line(x, 14, 18);
    for (int i = 0; i < 12; i++) {
      int y = 30 - ((i * 7 + millis() / 80) % 15);
      it.filled_circle((i * 11 + millis() / 35) % 128, y, 1);
    }
