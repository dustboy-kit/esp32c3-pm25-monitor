# ─────────────────────────────────────────────────────────────────────────────
# THE PANEL.
#
# flip_x / flip_y match dbk.yaml — the DBK enclosure mounts the SSD1306 upside
# down. On a bare breadboard board the gallery will read upside down; drop both
# lines in that case. They are a hardware remap, so no lambda coordinate moves.
#
# The real panel refreshes at 20 FPS so millis()-driven motion matches the HTML
# gallery instead of stepping once per second. The logical surface remains the
# native 128x32 buffer: no scaling, offset, or hidden software margin.
# ─────────────────────────────────────────────────────────────────────────────

# Adopt the complete editable file in ESPHome Device Builder. To rename
# the node, follow ESPHome's two-step name/use_address migration.
dashboard_import:
  package_import_url: github://dustboy-kit/esp32c3-pm25-monitor/sim/canvas/split-polarity.yaml@main
  import_full_config: true

display:
- platform: ssd1306_i2c
  id: oled
  i2c_id: oled_bus
  model: SSD1306_128X32
  address: 0x3C
  update_interval: 50ms
  flip_x: true
  flip_y: true
  lambda: |-
    static uint8_t M[512]; for (int i = 0; i < 512; i++) M[i] = 0;
    static const uint8_t SEG[10] = {0x7E,0x30,0x6D,0x79,0x33,0x5B,0x5F,0x70,0x7F,0x7B};
    static const char K[] = "PM2510";
    static const uint8_t GL[6][3] = {{31,5,2},{31,2,31},{29,21,23},{23,21,29},{18,31,16},{31,17,31}};
    auto st = [&](int x, int y) { if (x >= 0 && x < 128 && y >= 0 && y < 32) M[(y * 128 + x) >> 3] |= (1 << (x & 7)); };
    auto rct = [&](int a, int b, int w, int h) { for (int p = 0; p < h; p++) for (int k = 0; k < w; k++) st(a + k, b + p); };
    auto mtx = [&](const char *s, int a, int b) { for (int m = 0; s[m]; m++) for (int q = 0; q < 6; q++) if (K[q] == s[m]) {
      for (int c = 0; c < 3; c++) for (int r = 0; r < 5; r++) if ((GL[q][c] >> r) & 1) st(a + m * 4 + c, b + r); break; } };
    auto seg = [&](int d, int a, int b, int w, int h, int k) { const uint8_t s = SEG[d]; const int vh = (h - 3 * k) / 2;
      if (s & 0x40) rct(a + k, b, w - 2 * k, k);          if (s & 0x20) rct(a + w - k, b + k, k, vh);
      if (s & 0x10) rct(a + w - k, b + 2 * k + vh, k, vh); if (s & 0x08) rct(a + k, b + h - k, w - 2 * k, k);
      if (s & 0x04) rct(a, b + 2 * k + vh, k, vh);        if (s & 0x02) rct(a, b + k, k, vh);
      if (s & 0x01) rct(a + k, b + k + vh, w - 2 * k, k); };
    const float raw[2] = {id(pms_pm25).state, id(pms_pm10).state};
    for (int i = 0; i < 2; i++) {
      int val = (raw[i] > 0.0f) ? (int)(raw[i] + 0.5f) : 0; if (val > 999) val = 999;
      const int bx = i * 64, n = (val > 99) ? 3 : ((val > 9) ? 2 : 1);
      char v[4]; v[0] = '0' + val / 100; v[1] = '0' + (val / 10) % 10; v[2] = '0' + val % 10; v[3] = 0;
      const char *ds = v + (3 - n); const int x0 = bx + 32 - (17 * n - 3) / 2;
      int w = (int)(val * 56.0f / 150.0f + 0.5f); if (w > 56) w = 56;
      mtx(i ? "PM10" : "PM25", bx + 4, 2);
      for (int j = 0; j < n; j++) seg(ds[j] - '0', x0 + j * 17, 8, 14, 19, 3);
      if (w > 0) rct(bx + 4, 29, w, 2);
    }
    const int flip = (int) ((millis() / 2600) % 2);
    it.filled_rectangle(flip ? 64 : 0, 0, 64, 32, COLOR_ON);
    for (int y = 0; y < 32; y++) for (int x = 0; x < 128; x++)
      if ((M[(y * 128 + x) >> 3] >> (x & 7)) & 1) it.draw_pixel_at(x, y, ((x < 64) == (flip == 0)) ? COLOR_OFF : COLOR_ON);
